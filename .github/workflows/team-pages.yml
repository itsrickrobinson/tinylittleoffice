# This fork's own site on GitHub Pages (docs/fork.md): every push to main is built for the fork's own address and
# published there, the same static build as Aboard's mirror (npm run build:mirror's settings, docs/mirror.md) with the
# fork's address in place of theirs. No secret: Ask Claude uses each reader's own key, in their own browser, and live
# sessions meet through public relays.
#
# Once, in the repository: Settings, Pages, Source "GitHub Actions". The address is https://<owner>.github.io/<repo>/,
# worked out below, so a fork of this fork publishes at its own. Every action is pinned by its commit, the version
# beside it (test/deploy.test.ts).
name: Team site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for this fork's address
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          export VITE_SITE_URL="https://${OWNER,,}.github.io/${REPO}/"
          echo "Building for ${VITE_SITE_URL}"
          VITE_CSP_META=1 VITE_CARDS=0 VITE_TINIER=https://tinier.tinylittleoffice.com/ npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
